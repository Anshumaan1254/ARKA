name: alzheimer_care_app
description: Alzheimer Care App for Imagine Cup 2026 - Helping patients recognize people, manage medications, and stay safe.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  camera: ^0.10.5+9
  permission_handler: ^11.1.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  speech_to_text: ^6.3.0
  flutter_tts: ^3.8.5
  audioplayers: ^5.2.1
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  flutter_local_notifications: ^16.3.0
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.2
  intl: ^0.18.1
  cached_network_image: ^3.3.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
